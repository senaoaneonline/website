<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forum - Senaoane Community</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="top-red"></div>
<div class="nav">
  <a href="index.html" class="logo"><b>SENAOANE FORUM</b></a>
  <div style="display:flex;gap:8px">
    <a href="upload.html" class="btn btn-red">+ New Post</a>
    <a href="https://wa.me/27765269828" class="btn btn-green">WhatsApp</a>
  </div>
</div>

<div style="max-width:1200px;margin:auto;padding:16px">
  <div style="display:flex;gap:8px;margin:16px 0;flex-wrap:wrap">
    <button class="btn btn-dark" onclick="renderPosts('forum-feed')">All</button>
    <button class="btn btn-dark" onclick="renderPosts('forum-feed','SPORTS')">Sports</button>
    <button class="btn btn-dark" onclick="renderPosts('forum-feed','COMMUNITY')">Meetings</button>
    <button class="btn btn-dark" onclick="renderPosts('forum-feed','JOBS')">Jobs</button>
    <button class="btn btn-dark" onclick="renderPosts('forum-feed','EVENTS')">Events</button>
    <button class="btn btn-dark" onclick="renderPosts('forum-feed','NEWS')">News</button>
  </div>
  <div id="forum-feed" class="grid"></div>
</div>

<script src="js/app.js"></script>
<script>
fetch('data/posts.json').then(r=>r.json()).then(sample=>{
  const existing = JSON.parse(localStorage.getItem('senaoane_posts')||'[]');
  if(existing.length===0) localStorage.setItem('senaoane_posts', JSON.stringify(sample));
  renderPosts('forum-feed');
});
</script>
</body></html>
